<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mind Map</title>
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/theme.css">
<script>
/* Проставляем data-theme ДО первой отрисовки, чтобы не было мигания
   светлой темой при загрузке (сохранённая тема / системная тема). */
(function () {
  try {
    var saved = localStorage.getItem('mindmap-theme');
    var theme = saved === 'dark' || saved === 'light'
      ? saved
      : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
  } catch (e) {}
})();
</script>
</head>
<body>
<div id="toolbar" class="ribbon-toolbar">
  <div class="ribbon-group">
    <div class="ribbon-group__content">
      <div class="ribbon-group__row">
        <button id="btn-add-node" type="button" class="ribbon-btn">
          <span class="ribbon-btn__icon ribbon-btn__icon--neutral"><img src="assets/icons/type.svg" alt=""></span>
          <span class="ribbon-btn__label">Текст</span>
        </button>
        <button id="btn-add-test" type="button" class="ribbon-btn">
          <span class="ribbon-btn__icon ribbon-btn__icon--glyph">&gt;?</span>
          <span class="ribbon-btn__label">Тест</span>
        </button>
        <button id="btn-add-link" type="button" class="ribbon-btn">
          <span class="ribbon-btn__icon"><img src="assets/icons/link.svg" alt=""></span>
          <span class="ribbon-btn__label">Ссылка</span>
        </button>
        <button id="btn-mark-node" type="button" class="ribbon-btn">
          <span class="ribbon-btn__icon"><img src="assets/icons/check.svg" alt=""></span>
          <span class="ribbon-btn__label">Выполнен</span>
        </button>
        <button id="btn-remove-node" type="button" class="ribbon-btn">
          <span class="ribbon-btn__icon"><img src="assets/icons/trash.svg" alt=""></span>
          <span class="ribbon-btn__label">Удалить</span>
        </button>
      </div>
      <span class="ribbon-group__label">Узлы</span>
    </div>
    <span class="ribbon-divider"></span>
  </div>

  <div class="ribbon-group">
    <div class="ribbon-group__content">
      <div class="ribbon-group__row">
        <button id="btn-help-docs" type="button" class="ribbon-btn">
          <span class="ribbon-btn__icon"><img src="assets/icons/book.svg" alt=""></span>
          <span class="ribbon-btn__label">Справка</span>
        </button>
        <button id="btn-notes" type="button" class="ribbon-btn">
          <span class="ribbon-btn__icon"><img src="assets/icons/panel.svg" alt=""></span>
          <span class="ribbon-btn__label">Панель</span>
        </button>
      </div>
      <span class="ribbon-group__label">Сведения</span>
    </div>
    <span class="ribbon-divider"></span>
  </div>

  <div class="ribbon-group">
    <div class="ribbon-group__content">
      <div class="ribbon-group__row">
        <button id="btn-import" type="button" class="ribbon-btn">
          <span class="ribbon-btn__icon"><img src="assets/icons/arrow-down.svg" alt=""></span>
          <span class="ribbon-btn__label">Импорт JSON</span>
        </button>
        <button id="btn-export" type="button" class="ribbon-btn">
          <span class="ribbon-btn__icon"><img src="assets/icons/arrow-up.svg" alt=""></span>
          <span class="ribbon-btn__label">Экспорт JSON</span>
        </button>
        <button id="btn-clear-scheme" type="button" class="ribbon-btn">
          <span class="ribbon-btn__icon"><img src="assets/icons/eracer.svg" alt=""></span>
          <span class="ribbon-btn__label">Очистить</span>
        </button>
      </div>
      <span class="ribbon-group__label">Схема</span>
    </div>
    <span class="ribbon-divider"></span>
  </div>

  <div class="ribbon-group">
    <div class="ribbon-group__content">
      <div class="ribbon-group__row">
        <button id="btn-theme" type="button" class="ribbon-btn">
          <span class="ribbon-btn__icon ribbon-btn__icon--neutral"><img src="assets/icons/theme.svg" alt=""></span>
          <span class="ribbon-btn__label">Тема</span>
        </button>
      </div>
      <span class="ribbon-group__label">Инструменты</span>
    </div>
  </div>

  <input id="input-import" type="file" accept="application/json,.json" hidden>
</div>

<div id="work-area">
  <!-- Панель справки: независимая от #side-panel, слева; наполняется динамически из help.js -->
  <aside id="help-panel" class="help-panel" hidden></aside>

  <div id="mindmap-root"></div>

  <aside id="side-panel" class="side-panel" hidden>
    <!-- Вью заметок (для узлов любого типа, кроме сценария теста) -->
    <div id="notes-view" class="side-view">
      <div class="notes-panel__header">
        <span class="notes-panel__icon"><img src="assets/icons/edit.svg" alt=""></span>
        <span class="notes-panel__title">Заметка</span>
        <button id="notes-close" type="button" class="notes-panel__close" title="Закрыть панель"><img src="assets/icons/notes-close.svg" alt=""></button>
      </div>

      <div id="notes-toolbar" class="notes-toolbar">
        <button type="button" class="notes-btn" data-cmd="bold" title="Полужирный"><img src="assets/icons/notes-bold.svg" alt=""></button>
        <button type="button" class="notes-btn" data-cmd="italic" title="Курсив"><img src="assets/icons/notes-italic.svg" alt=""></button>
        <button type="button" class="notes-btn" data-cmd="underline" title="Подчёркнутый"><img src="assets/icons/notes-underline.svg" alt=""></button>
        <span class="notes-toolbar__divider"></span>
        <button type="button" class="notes-btn" data-cmd="heading" title="Заголовок (вкл/выкл)"><img src="assets/icons/notes-heading.svg" alt=""></button>
        <span class="notes-toolbar__divider"></span>
        <button type="button" class="notes-btn" data-cmd="ul" title="Маркированный список"><img src="assets/icons/notes-list.svg" alt=""></button>
        <button type="button" class="notes-btn" data-cmd="ol" title="Нумерованный список"><img src="assets/icons/notes-list-ordered.svg" alt=""></button>
        <span class="notes-toolbar__divider"></span>
        <button type="button" class="notes-btn" data-cmd="link" title="Вставить ссылку"><img src="assets/icons/notes-link.svg" alt=""></button>
        <button type="button" class="notes-btn" data-cmd="image" title="Вставить изображение (по ссылке)"><img src="assets/icons/notes-image.svg" alt=""></button>
        <button id="notes-mode-toggle" type="button" class="notes-btn notes-btn--mode" title="Переключить режим: Markdown ↔ визуальный"><img src="assets/icons/notes-code.svg" alt=""></button>
      </div>

      <div class="notes-panel__editor">
        <textarea id="notes-source" class="notes-source" placeholder="Здесь можно создать заметку" spellcheck="false"></textarea>
        <div id="notes-visual" class="notes-visual" contenteditable="true" data-placeholder="Здесь можно создать заметку"></div>
      </div>
    </div>

    <!-- Вью теста (для узлов типа 'test'); наполняется динамически из test.js -->
    <div id="test-view" class="side-view" hidden></div>
  </aside>
</div>

<div id="status-bar">Клик — выделить, двойной клик по тексту — редактировать, Enter — добавить, Delete — удалить, drag&amp;drop — перенести. Наведите на узел — появятся кнопки добавления и редактирования.</div>

<!-- Порядок подключения важен: каждый следующий файл использует объекты, объявленные предыдущими -->
<script src="js/theme.js"></script>
<script src="js/nodeTypes.js"></script>
<script src="js/model.js"></script>
<script src="js/storage.js"></script>
<script src="js/dragdrop.js"></script>
<script src="js/render.js"></script>
<script src="js/markdown.js"></script>
<script src="js/notes.js"></script>
<script src="js/test.js"></script>
<script src="js/help.js"></script>
<script src="js/panelResize.js"></script>
<script src="js/pan.js"></script>
<script src="js/app.js"></script>
</body>
</html>

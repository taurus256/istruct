<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mind Map</title>
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/theme.css">
</head>
<body>
<div id="toolbar">
  <button id="btn-add-node" type="button">+ Добавить узел</button>
  <button id="btn-add-comment" type="button">+ Добавить комментарий</button>
  <button id="btn-export" type="button">Экспорт JSON</button>
  <button id="btn-import" type="button">Импорт JSON</button>
  <input id="input-import" type="file" accept="application/json,.json" hidden>
  <span id="toolbar-hint">Клик — выделить, двойной клик по тексту — редактировать, Enter — добавить, Delete — удалить, drag&amp;drop — перенести.</span>
</div>

<div id="mindmap-root"></div>

<!-- Порядок подключения важен: каждый следующий файл использует объекты, объявленные предыдущими -->
<script src="js/nodeTypes.js"></script>
<script src="js/model.js"></script>
<script src="js/storage.js"></script>
<script src="js/dragdrop.js"></script>
<script src="js/render.js"></script>
<script src="js/pan.js"></script>
<script src="js/app.js"></script>
</body>
</html>
